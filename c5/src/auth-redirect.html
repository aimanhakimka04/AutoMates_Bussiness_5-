<!DOCTYPE html>
<html>
  <head>
    <title>Authenticating...</title>
  </head>
  <body>
    <script>
      // This page handles the Microsoft OAuth2 redirect inside the popup.
      // It passes the auth response back to the parent window and closes itself.
      // MSAL picks this up automatically via BroadcastChannel / localStorage.
    </script>
    <!-- Load the same MSAL version your app uses -->
    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
    <script>
      (async () => {
        try {
          const msalConfig = {
            auth: {
              clientId:  'c21063b3-e6df-4a0e-980a-eb69cb6bdd01',
              authority: 'https://login.microsoftonline.com/common',
              redirectUri: window.location.origin + '/auth-redirect.html',
            },
            cache: {
              cacheLocation: 'sessionStorage',
              storeAuthStateInCookie: true,
            },
          };
          const instance = new msal.PublicClientApplication(msalConfig);
          await instance.initialize();
          // This call processes the auth code/token from the URL hash
          // and notifies the parent popup opener automatically
          await instance.handleRedirectPromise();
        } catch (e) {
          console.error('Redirect handler error:', e);
        }
      })();
    </script>
  </body>
</html>
